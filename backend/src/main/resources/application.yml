spring:
  application:
    name: todolist

  # .env 파일 로드 (파일 자체는 ${} 그대로 두고, 실행 시점에 치환됨)
  # backend/ 에서 실행 → .env / monorepo 루트에서 실행 → backend/.env
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./backend/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:TodoListDB}?currentSchema=todolist_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: todolist_db
        format_sql: true
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${SERVER_PORT:8080}

# JWT 설정 (secret은 반드시 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:placeholder-jwt-secret-must-be-at-least-32-characters-long}
  access-token-expiration: 1800000   # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

# CORS — 프론트 도메인만 허용
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3000}

# OAuth 로그인 성공 후 리다이렉트할 프론트 URL
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}

# AWS S3 + CloudFront (환경변수 placeholder)
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3-bucket: ${AWS_S3_BUCKET:placeholder-s3-bucket}
  cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:https://placeholder.cloudfront.net}
  access-key-id: ${AWS_ACCESS_KEY_ID:placeholder-access-key}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:placeholder-secret-key}
